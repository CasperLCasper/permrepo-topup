<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermRepo — Apmaksāt Glabāšanu</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://esm.sh 'sha384-gpR0Q6Hx/O+uevlbpbANbS0LWjbejPV1sqD/8w422l/fW8whGY0EPmKw3uG7ACYP' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://sepolia.base.org https://mainnet.base.org https://upload.services.ar-io.dev https://payment.services.ar-io.dev https://raw.githubusercontent.com https://esm.sh https://unpkg.com; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container text-center">
    <h1>💳 Apmaksāt Glabāšanu</h1>
    <p class="subtitle">Maksā ar MetaMask un augšupielādē failus Arweave</p>
    
    <div class="info-row text-left">
        <span class="info-label">Repo</span>
        <input type="text" id="repoInput" placeholder="piem., lietotajs/repo" value="">
    </div>
    
    <div class="info-row text-left">
        <span class="info-label">Laika zīmogs</span>
        <span class="info-value" id="timestamp">-</span>
    </div>
    
    <div class="info-row text-left">
        <span class="info-label">Faili</span>
        <span class="info-value" id="fileCount">Nav norādīti</span>
    </div>
    
    <div class="info-row text-left">
        <span class="info-label">Kopējais izmērs</span>
        <span class="info-value" id="totalSize">Aprēķina...</span>
    </div>

    <div class="info-row text-left">
        <span class="info-label">Valūta</span>
        <select id="currencySelect" style="padding: 5px; border-radius: 4px;">
            <option value="base-eth">Base ETH</option>
            <option value="base-usdc">Base USDC</option>
        </select>
    </div>
    
    <button id="payButton" class="sign-button" disabled>⏳ Gaida savienojumu...</button>
    <div class="status" id="status"></div>
    <div class="error" id="error"></div>
</div>
<script type="module" src="js/storage-pay.js"></script>
</body>
</html>
